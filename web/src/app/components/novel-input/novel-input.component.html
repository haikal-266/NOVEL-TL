<section class="neo-card p-3.5 sm:p-4 mb-3.5 bg-white border-[2px] border-black shadow-[3px_3px_0px_#000]">
  <!-- Header -->
  <div class="flex items-center justify-between mb-2.5">
    <div class="flex items-center space-x-2">
      <span class="neo-badge bg-[#D7FF28] text-black text-[9px] px-2 py-0.5 font-mono flex items-center gap-1 border border-black">
        <app-icon name="zap" [size]="10" />
        <span>INPUT</span>
      </span>
      <h2 class="font-black text-xs uppercase tracking-wide text-[#1A1A1A]">
        Novel URL (Kakuyomu / Syosetu)
      </h2>
    </div>

    @if (url) {
      <button
        type="button"
        (click)="url = ''"
        class="text-[10px] font-bold text-gray-400 hover:text-black font-mono inline-flex items-center gap-1"
      >
        <app-icon name="trash" [size]="11" />
        <span>Clear</span>
      </button>
    }
  </div>

  <!-- Input Field & Submit -->
  <div class="space-y-2.5">
    <input
      id="novelUrl"
      type="url"
      [(ngModel)]="url"
      placeholder="https://kakuyomu.jp/... or https://ncode.syosetu.com/..."
      class="neo-input w-full p-2.5 sm:p-3 text-xs font-mono placeholder:text-gray-400 focus:bg-white"
      (keyup.enter)="onSubmit()"
      [disabled]="isLoading"
    />

    <!-- Submit CTA -->
    <button
      type="button"
      (click)="onSubmit()"
      [disabled]="!url.trim() || isLoading"
      class="neo-btn w-full p-3 bg-[#D7FF28] text-black font-black text-xs uppercase tracking-wider hover:bg-[#cbf71e] flex items-center justify-center gap-2 border-[2px] border-black"
    >
      @if (isLoading) {
        <span class="inline-block w-3.5 h-3.5 border-2 border-black border-t-transparent rounded-full animate-spin"></span>
        <span>INSPECTING NOVEL...</span>
      } @else {
        <span>FETCH NOVEL DETAILS</span>
        <app-icon name="arrow-right" [size]="14" />
      }
    </button>
  </div>
</section>
