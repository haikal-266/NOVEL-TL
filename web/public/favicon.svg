<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Neo-Brutalist Squircle Canvas -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="#D7FF28" stroke="#121212" stroke-width="4"/>
  
  <!-- Top-right Pink Tag -->
  <rect x="40" y="6" width="16" height="8" rx="2" fill="#E78FB3" stroke="#121212" stroke-width="2"/>

  <!-- Book Drop Shadow -->
  <rect x="14" y="20" width="38" height="28" rx="4" fill="#121212"/>

  <!-- Book Main Cover -->
  <rect x="11" y="17" width="38" height="28" rx="4" fill="#121212"/>

  <!-- Left Page (Japanese Source) -->
  <rect x="13" y="19" width="16" height="24" rx="2" fill="#FFFFFF" stroke="#121212" stroke-width="2"/>
  <!-- Left Page character '文' -->
  <text x="21" y="34" font-family="'Segoe UI', 'Meiryo', sans-serif" font-weight="900" font-size="11" fill="#121212" text-anchor="middle">文</text>

  <!-- Right Page (Translated Target) -->
  <rect x="31" y="19" width="16" height="24" rx="2" fill="#FFFFFF" stroke="#121212" stroke-width="2"/>
  <!-- Right Page character 'TL' -->
  <text x="39" y="34" font-family="Impact, 'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="11" fill="#121212" text-anchor="middle">TL</text>

  <!-- Center Translation Lightning Bolt ⚡ -->
  <polygon points="31,21 27,29 30,29 29,37 34,28 31,28" fill="#D7FF28" stroke="#121212" stroke-width="1.8"/>

  <!-- Bottom Accent Stripe -->
  <rect x="18" y="49" width="28" height="6" rx="2" fill="#FFFFFF" stroke="#121212" stroke-width="2"/>
</svg>

